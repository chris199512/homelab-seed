name: homelab-seed
description: Build a self-installing Raspberry Pi installer image with homelab-seed
author: chris199512
branding:
  icon: package
  color: green

inputs:
  config:
    description: >
      Path to config.env, or to the config.env of an unpacked config bundle.
      Files it references must be inside its directory.
    default: config.env
  output:
    description: Directory the image is written to
    default: out
  compress:
    description: Compress the image with xz (true/false)
    default: "true"
  free-disk-space:
    description: >
      Remove unused preinstalled software on GitHub-hosted runners first.
      The build needs about 25 GB, more than a standard runner has free.
    default: "true"

outputs:
  image:
    description: Path of the built image
    value: ${{ steps.build.outputs.image }}
  checksum:
    description: Path of the SHA256 checksum file
    value: ${{ steps.build.outputs.checksum }}

runs:
  using: composite
  steps:
    - name: Check runner
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error::homelab-seed needs a Linux runner with Docker (e.g. ubuntu-latest)"
        exit 1

    - name: Free disk space
      if: inputs.free-disk-space == 'true' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Build image
      id: build
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_COMPRESS: ${{ inputs.compress }}
      run: |
        args=(--config "$INPUT_CONFIG" --output "$INPUT_OUTPUT")
        if [[ $INPUT_COMPRESS == true ]]; then args+=(--xz); fi
        bash "$GITHUB_ACTION_PATH/build.sh" "${args[@]}"
        image=$(ls -t "$INPUT_OUTPUT"/homelab-seed-*.img* | grep -v '\.sha256$' | head -n1)
        echo "image=$image" >>"$GITHUB_OUTPUT"
        echo "checksum=$image.sha256" >>"$GITHUB_OUTPUT"
